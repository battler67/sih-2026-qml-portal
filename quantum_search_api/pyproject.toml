[project]
name = "qdna-genomics-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.135",
  "httpx>=0.28",
  "pydantic>=2.12",
  "python-dotenv>=1.2",
  "uvicorn>=0.37,<1",
  "qiskit>=2.5,<3",
  "qiskit-aer>=0.17,<1",
  "qiskit-ibm-runtime>=0.46,<1",
  "qbraid>=0.12,<1",
  "numpy>=2.2,<3",
  "matplotlib>=3.10,<4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
