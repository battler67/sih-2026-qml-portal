[project]
name = "qdna-qml-inference"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.135",
  "httpx>=0.28,<1",
  "joblib>=1.5,<2",
  "numpy==2.5.2",
  "pennylane==0.45.1",
  "pillow==12.3.0",
  "scikit-learn==1.9.0",
  "uvicorn>=0.37,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
